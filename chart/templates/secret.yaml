apiVersion: v1
kind: Secret
metadata:
  name: {{ .Chart.Name }}-credentials
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "synology-mcp.labels" . | nindent 4 }}
type: Opaque
stringData:
  url: {{ .Values.synology.url | quote }}
  username: {{ .Values.synology.username | quote }}
  password: {{ .Values.synology.password | quote }}
  verifySsl: {{ .Values.synology.verifySsl | quote }}
