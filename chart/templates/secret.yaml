apiVersion: v1
kind: Secret
metadata:
  name: {{ .Chart.Name }}-credentials
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "synology-mcp.labels" . | nindent 4 }}
type: Opaque
stringData:
  host: {{ .Values.synology.host | quote }}
  username: {{ .Values.synology.username | quote }}
  password: {{ .Values.synology.password | quote }}
