apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Chart.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "synology-mcp.labels" . | nindent 4 }}
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "synology-mcp.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "synology-mcp.selectorLabels" . | nindent 8 }}
      annotations:
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
    spec:
      containers:
        - name: mcp-server
          image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - "--pass-environment"
            - "--host=0.0.0.0"
            - "--port={{ .Values.service.port }}"
            - "--"
            - "mcp-server-synology"
          env:
            - name: SYNOLOGY_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Chart.Name }}-credentials
                  key: url
            - name: SYNOLOGY_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Chart.Name }}-credentials
                  key: username
            - name: SYNOLOGY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Chart.Name }}-credentials
                  key: password
            - name: VERIFY_SSL
              valueFrom:
                secretKeyRef:
                  name: {{ .Chart.Name }}-credentials
                  key: verifySsl
          ports:
            - name: mcp
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /status
              port: mcp
            initialDelaySeconds: 2
            periodSeconds: 5
            failureThreshold: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
