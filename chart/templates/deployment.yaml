apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Chart.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "synology-mcp.labels" . | nindent 4 }}
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "synology-mcp.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "synology-mcp.selectorLabels" . | nindent 8 }}
      annotations:
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      containers:
        - name: mcp-server
          image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - "--pass-environment"
            - "--host=0.0.0.0"
            - "--port={{ .Values.service.port }}"
            - "uvx"
            - "--with"
            - "mcp<2"
            - "mcp-synology"
            - "serve"
          env:
            - name: SYNOLOGY_HOST
              valueFrom:
                secretKeyRef:
                  name: {{ .Chart.Name }}-credentials
                  key: host
            - name: SYNOLOGY_PORT
              valueFrom:
                secretKeyRef:
                  name: {{ .Chart.Name }}-credentials
                  key: port
            - name: SYNOLOGY_HTTPS
              valueFrom:
                secretKeyRef:
                  name: {{ .Chart.Name }}-credentials
                  key: https
            - name: SYNOLOGY_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Chart.Name }}-credentials
                  key: username
            - name: SYNOLOGY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Chart.Name }}-credentials
                  key: password
          ports:
            - name: mcp
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
